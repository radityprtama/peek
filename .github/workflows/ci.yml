name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22'
          - os: ubuntu-24.04-arm
            node: '22'
          - os: macos-15-intel
            node: '22'
          - os: macos-15
            node: '22'
          - os: windows-2025
            node: '22'
          - os: ubuntu-24.04
            node: '24'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:check
      - run: pnpm smoke:pack
